# Test overrides: in-memory H2 (so Flyway + JPA validate run against the real migration) and
# no Eureka registration during tests.
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authtest;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  flyway:
    enabled: true
    schemas: auth_service
    default-schema: auth_service
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: auth_service
    open-in-view: false

eureka:
  client:
    enabled: false

agritech:
  jwt:
    secret: auth-service-test-jwt-secret-at-least-32-bytes-long
    access-ttl-minutes: 15

# InternalAuth is scanned from the common module and refuses to start without a real signing
# secret; this is a throwaway test value, never used outside the test JVM.
AGRITECH_INTERNAL_SECRET: auth-service-test-internal-secret-at-least-32-chars
