server:
  port: 8081
  # Finish in-flight requests on a rolling restart instead of dropping them.
  shutdown: graceful

spring:
  # Bounded wait for the graceful shutdown above; past this the context closes.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: auth-service
  # Configure DB_URL / DB_USERNAME / DB_PASSWORD for PostgreSQL; unset = persistent local H2 file.
  datasource:
    url: ${DB_URL:jdbc:h2:file:${agritech.data-dir:./.run/data}/authdb;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # 4 services share Supabase's pooler connection limit.
      maximum-pool-size: 3
  # Flyway owns the schema. V1 rebuilds users/stored_tokens with the UUID baseline; Hibernate only
  # validates that entities match. baseline-on-migrate lets an existing (pre-Flyway) database
  # adopt versioning instead of failing startup.
  flyway:
    enabled: true
    schemas: auth_service
    default-schema: auth_service
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: auth_service
    open-in-view: false

agritech:
  jwt:
    # No default on purpose. Set AGRITECH_JWT_SECRET (generate with `openssl rand -hex 32`).
    # scripts/stack.ps1 provisions one into .env automatically on first run; without it the
    # service refuses to start rather than sign tokens with a key from the repository.
    secret: ${AGRITECH_JWT_SECRET:}
    # Short-lived access tokens; clients renew silently via POST /api/auth/refresh (30-day refresh token).
    access-ttl-minutes: 15
  supabase:
    # Supabase project settings (Dashboard -> Project Settings):
    #   SUPABASE_URL      = Project URL, e.g. https://<ref>.supabase.co
    #   SUPABASE_ANON_KEY = anon public key (API Keys page)
    # Tokens are validated through Supabase's /auth/v1/user endpoint, so this works with both the
    # legacy HS256 secret and the newer ES256 signing keys. Blank until set; while blank the
    # /api/auth/google endpoint rejects all tokens.
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    AUDIT: INFO
