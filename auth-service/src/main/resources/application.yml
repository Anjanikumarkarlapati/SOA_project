server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

agritech:
  jwt:
    # Required, with no fallback: a default here would be a published signing key. The gateway
    # and auth-service must be given the same value. Generate one with:
    #   export AGRITECH_JWT_SECRET=$(openssl rand -base64 48)
    secret: ${AGRITECH_JWT_SECRET:}
    access-ttl-hours: 24
  supabase:
    # Supabase project settings (Dashboard -> Project Settings):
    #   SUPABASE_URL      = Project URL, e.g. https://<ref>.supabase.co
    #   SUPABASE_ANON_KEY = anon public key (API Keys page)
    # Tokens are validated through Supabase's /auth/v1/user endpoint, so this works with both the
    # legacy HS256 secret and the newer ES256 signing keys. Blank until set; while blank the
    # /api/auth/google endpoint rejects all tokens.
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    AUDIT: INFO
