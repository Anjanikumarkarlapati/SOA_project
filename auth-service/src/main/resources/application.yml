server:
  port: 8081

spring:
  application:
    name: auth-service
  # Set DB_URL / DB_USERNAME / DB_PASSWORD (in .env) to use Supabase Postgres; unset = local H2 file.
  datasource:
    url: ${DB_URL:jdbc:h2:file:${agritech.data-dir:./.run/data}/authdb;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # 4 services share Supabase's pooler connection limit.
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

agritech:
  jwt:
    # Override in every real environment: AGRITECH_JWT_SECRET
    secret: ${AGRITECH_JWT_SECRET:agritech-dev-secret-key-change-me-in-production-0123456789}
    # Short-lived access tokens; clients renew silently via POST /api/auth/refresh (30-day refresh token).
    access-ttl-minutes: 15
  supabase:
    # Supabase project settings (Dashboard -> Project Settings):
    #   SUPABASE_URL      = Project URL, e.g. https://<ref>.supabase.co
    #   SUPABASE_ANON_KEY = anon public key (API Keys page)
    # Tokens are validated through Supabase's /auth/v1/user endpoint, so this works with both the
    # legacy HS256 secret and the newer ES256 signing keys. Blank until set; while blank the
    # /api/auth/google endpoint rejects all tokens.
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    AUDIT: INFO
