server:
  port: 8084

spring:
  application:
    name: irrigation-service
  cloud:
    loadbalancer:
      retry:
        # The irrigation-event POST to sensor-service is idempotent, so it may be retried too.
        retry-on-all-operations: true
  # Set DB_URL / DB_USERNAME / DB_PASSWORD (in .env) to use Supabase Postgres; unset = local H2 file.
  datasource:
    url: ${DB_URL:jdbc:h2:file:${agritech.data-dir:./.run/data}/irrigationdb;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # 4 services share Supabase's pooler connection limit.
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

agritech:
  irrigation:
    tick-ms: 30000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    AUDIT: INFO
