server:
  port: 8086
  # Finish in-flight requests on a rolling restart instead of dropping them.
  shutdown: graceful
spring:
  # Bounded wait for the graceful shutdown above; past this the context closes.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: climate-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
