<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c2619" media="(prefers-color-scheme: dark)" />
    <title>AgriTech Sensing Solutions</title>
    <meta
      name="description"
      content="Operations dashboard for precision agriculture: soil telemetry, crop health scoring and irrigation control across the farm."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23485c11'/%3E%3Cpath d='M16 25V13m0 0c0-3.9 3.1-7 7-7 0 3.9-3.1 7-7 7Zm0 3c0-3.3-2.7-6-6-6 0 3.3 2.7 6 6 6Z' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />

    <meta name="theme-color" content="#ffffff" />

    <!-- Theme is resolved before first paint so a dark-mode operator never gets a white flash.
         Mirrors the storage key and fallback in session.jsx; keep the two in step. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('agritech.theme')
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f110c' : '#ffffff')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
