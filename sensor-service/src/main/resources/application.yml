server:
  port: 8082

spring:
  application:
    name: sensor-service
  datasource:
    url: jdbc:h2:mem:sensordb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 200
  jackson:
    serialization:
      write-dates-as-timestamps: false

agritech:
  simulator:
    # Set false to run against real devices posting to /api/telemetry/ingest.
    enabled: ${SIMULATOR_ENABLED:true}
    interval-ms: 30000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    AUDIT: INFO
