server:
  port: 8082

spring:
  application:
    name: sensor-service
  # Set DB_URL / DB_USERNAME / DB_PASSWORD (in .env) to use Supabase Postgres; unset = local H2 file.
  datasource:
    url: ${DB_URL:jdbc:h2:file:${agritech.data-dir:./.run/data}/sensordb;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # 4 services share Supabase's pooler connection limit.
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 200
  jackson:
    serialization:
      write-dates-as-timestamps: false

agritech:
  simulator:
    # Set false to run against real devices posting to /api/telemetry/ingest.
    enabled: ${SIMULATOR_ENABLED:${agritech.jobs.enabled:true}}
    interval-ms: 30000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    AUDIT: INFO
