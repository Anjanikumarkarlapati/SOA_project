server:
  port: 8082
  # Finish in-flight requests on a rolling restart instead of dropping them.
  shutdown: graceful

spring:
  # Bounded wait for the graceful shutdown above; past this the context closes.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: sensor-service
  # Configure DB_URL / DB_USERNAME / DB_PASSWORD for PostgreSQL; unset = persistent local H2 file.
  datasource:
    url: ${DB_URL:jdbc:h2:file:${agritech.data-dir:./.run/data}/sensordb;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # 4 services share Supabase's pooler connection limit.
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_schema: sensor_service
      hibernate.hbm2ddl.create_namespaces: true
      hibernate.jdbc.batch_size: 200
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

agritech:
  simulator:
    # Set false to run against real devices posting to /api/telemetry/ingest.
    enabled: ${SIMULATOR_ENABLED:${agritech.jobs.enabled:true}}
    interval-ms: 30000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    AUDIT: INFO
