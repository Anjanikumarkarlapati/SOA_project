server:
  port: 8083

spring:
  application:
    name: crop-service
  # Set DB_URL / DB_USERNAME / DB_PASSWORD (in .env) to use Supabase Postgres; unset = local H2 file.
  datasource:
    url: ${DB_URL:jdbc:h2:file:${agritech.data-dir:./.run/data}/cropdb;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      # 4 services share Supabase's pooler connection limit.
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

agritech:
  analysis:
    # PRD 5.1: crop health metrics updated every 5 minutes.
    interval-ms: 300000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
