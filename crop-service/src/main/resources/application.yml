server:
  port: 8083

spring:
  application:
    name: crop-service
  datasource:
    url: jdbc:h2:mem:cropdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

agritech:
  analysis:
    # PRD 5.1: crop health metrics updated every 5 minutes.
    interval-ms: 300000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
